<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>{{title}}｜{{date}}</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color: #182a3d; background: #f1f4f8; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.75; }
    .hero { background: #102a43; color: #fff; padding: 36px max(24px, calc((100vw - 1056px)/2)); }
    .eyebrow { color: #afe0ec; font-size: 13px; font-weight: 700; }
    h1 { margin: 10px 0; font-size: clamp(26px, 5vw, 36px); line-height: 1.4; }
    .date { margin: 0; color: #cfdae5; }
    main { max-width: 1104px; margin: 0 auto; padding: 24px; }
    .notice { border: 1px solid #e6be72; border-left: 5px solid #bd7909; background: #fff4d8; padding: 18px 22px; border-radius: 6px; margin-bottom: 24px; color: #684107; font-weight: 700; }
    section { padding: 26px 30px; margin-bottom: 22px; border: 1px solid #dce3eb; border-radius: 8px; background: #fff; }
    h2 { font-size: 21px; line-height: 1.5; margin: 0 0 18px; padding-bottom: 12px; border-bottom: 2px solid #dbeaf0; }
    h3 { font-size: 17px; margin: 24px 0 12px; color: #15586d; }
    p { margin: 12px 0; overflow-wrap: anywhere; }
    .table-wrap { overflow-x: auto; margin: 16px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #edf4f8; text-align: left; color: #284960; }
    td, th { padding: 10px 12px; border-bottom: 1px solid #e3e9ef; vertical-align: top; overflow-wrap: anywhere; }
    td:first-child { min-width: 118px; }
    tr:nth-child(even) td { background: #f9fbfd; }
    footer { text-align: center; padding: 16px 20px 40px; color: #5c6f80; font-size: 13px; }
    @media (max-width: 600px) { main { padding: 14px; } section { padding: 20px 16px; } td, th { padding: 9px; } }
    @media print { body { background: white; } .hero { padding: 20px; print-color-adjust: exact; } main { padding: 0; } section { border: 0; border-radius: 0; } h2, h3 { break-after: avoid; } tr { break-inside: avoid; } }
  </style>
</head>
<body>
  <header class="hero">
    <div class="eyebrow">M2 · {{input_kind}} · 仅行情研究</div>
    <h1>{{title}}</h1>
    <p class="date">分析交易日 {{date}} · 实际行情日期和生成时间见数据状态</p>
  </header>
  <main>
    <aside class="notice" role="note">{{notice}}</aside>
    {{body}}
  </main>
  <footer>小样本验证 · 固定规则与冻结输入 · 无模型调用</footer>
</body>
</html>
